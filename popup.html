<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; border: none; outline: none; box-shadow: none; -webkit-appearance: none; appearance: none; }
  body {
    width: 100px;
    background: #ffffff;
    font-family: monospace;
    font-size: 10px;
  }
  #msg {
    width: 100%;
    height: 14px;
    padding: 2px 3px;
    background: #ffffff;
    color: #000000;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #msg::-webkit-scrollbar { display: none; }
  #msg:empty { display: none; }
  #input-row {
    display: flex;
  }
  #input {
    flex: 1;
    background: #ffffff;
    color: #000000;
    border: none;
    outline: none;
    font-family: monospace;
    font-size: 10px;
    padding: 2px 3px;
    height: 16px;
  }
  #send, #clear {
    background: none;
    border: none;
    color: #000000;
    font-size: 10px;
    cursor: pointer;
    padding: 0 3px;
  }
  #send:hover, #clear:hover { color: #333; }
</style>
</head>
<body>
<div id="msg"></div>
<div id="input-row">
  <input id="input" placeholder="say something" autocomplete="off" />
  <button id="send">↑</button>
  <button id="clear">×</button>
</div>
<script src="popup.js"></script>
</body>
</html>
